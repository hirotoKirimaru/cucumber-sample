plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'java'
    id 'io.freefair.lombok' version "${lombokPluginVersion}"
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop' // aspect使いたい
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // xmlunitで特定の項目を無視したければ、このライブラリを使う。
    testImplementation 'org.xmlunit:xmlunit-core:2.10.0'
    testImplementation 'org.xmlunit:xmlunit-placeholders:2.10.0'

    testImplementation 'com.codeborne:selenide:7.6.1'
    testImplementation 'io.cucumber:cucumber-java:7.20.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.20.1'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        exclude group: 'junit', module: 'junit'
    }

    // FTPサーバ
    implementation 'commons-net:commons-net:3.11.1'
    testImplementation 'org.mockftpserver:MockFtpServer:3.2.0'
    testImplementation 'commons-io:commons-io:2.18.0'

    // rest-assured
    testImplementation 'io.rest-assured:xml-path:5.5.0'
    testImplementation ('io.rest-assured:spring-mock-mvc:5.5.0') {
        // コンフリクトするので除外
        exclude group: 'org.codehaus.groovy', module: 'groovy-xml'
    }

    // Wiremock Server (Spring Boot 3 / Jetty 11対応)
    testImplementation 'org.wiremock:wiremock-standalone:3.10.0'

    // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // CSVMapper
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'

    // spring-cloud-starter-config
//    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Unleash
    implementation 'io.getunleash:unleash-client-java:9.2.6'

    // static mock の検証 (mockito-coreにmockito-inlineが統合済み)
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

test {
    useJUnitPlatform()
}
