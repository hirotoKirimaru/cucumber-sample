plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'java'
    id 'io.freefair.lombok' version "${lombokPluginVersion}"
}

group 'kirimaru'
version '0.0.1'

test {
    useJUnitPlatform()
}

compileJava {

}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation project(':kirimaru-core')
    implementation project(':kirimaru-redis')
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Database
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'

    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'

    // database-rider
    testImplementation 'com.github.database-rider:rider-junit5:1.44.0'

    // coreのテストソースコードだけ依存させる
//    testCompileOnly project(':kirimaru-core').sourceSets.test.output
    testImplementation project(':kirimaru-core').sourceSets.test.output
}

test {
    useJUnitPlatform()
}
